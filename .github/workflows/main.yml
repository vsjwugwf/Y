name: YouTube Bot

on:
  schedule:
    # هر ۶ ساعت یکبار: ۰:۰۰, ۶:۰۰, ۱۲:۰۰, ۱۸:۰۰
    - cron: '0 */6 * * *'
  workflow_dispatch:   # برای اجرای دستی از طریق تب Actions

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # حداکثر ۶ ساعت (گیت‌هاب بعد از این زمان job را می‌کشد)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the bot (5h 55m loop)
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
        run: |
          start_time=$(date +%s)
          max_duration_seconds=$((5 * 3600 + 55 * 60))  # ۵ ساعت و ۵۵ دقیقه

          while true; do
            current_time=$(date +%s)
            elapsed=$((current_time - start_time))
            if [ $elapsed -ge $max_duration_seconds ]; then
              echo "⏰ زمان اجرا به ۵:۵۵ رسید. خروج آرام..."
              break
            fi

            python main.py || true
            sleep 2
          done
