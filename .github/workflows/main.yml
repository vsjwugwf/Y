name: YouTube Bale Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # ═══════════ سرویس‌های جانبی ═══════════
    services:
      warp-proxy:
        image: monerum/wgcf-proxy
        ports:
          - 8080:8080
        options: >-
          --health-cmd="curl -f http://localhost:8080"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      po-token:
        image: bgutil/ytdlp-pot-provider
        ports:
          - 4416:4416
        options: >-
          --health-cmd="curl -f http://localhost:4416"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the bot (5h 55m loop)
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
        run: |
          start_time=$(date +%s)
          max_duration_seconds=$((5 * 3600 + 55 * 60))
          while true; do
            current_time=$(date +%s)
            elapsed=$((current_time - start_time))
            if [ $elapsed -ge $max_duration_seconds ]; then
              echo "⏰ زمان اجرا به ۵:۵۵ رسید. خروج آرام..."
              break
            fi
            python main.py || true
            sleep 2
          done
